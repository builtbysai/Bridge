name: Bridge Deploy

# Manual-only until a real hosting target and credentials are configured.
# This avoids automatic build/deploy failures and notification noise.
on:
  workflow_dispatch:
    inputs:
      frontend_origin:
        description: Exact production frontend origin (https://host)
        required: true
        type: string
      signaling_url:
        description: Exact production signaling URL (wss://host/signal)
        required: true
        type: string

concurrency:
  group: bridge-deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BRIDGE_FRONTEND_ORIGIN: ${{ inputs.frontend_origin }}
      VITE_SIGNALING_URL: ${{ inputs.signaling_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - name: Verify Bridge-only change scope
        run: node scripts/verify-isolation.mjs
      - name: Verify workflow token permissions stay read-only
        run: npm run verify:workflow-permissions
      - name: Verify workflow concurrency stays bounded and superseded runs cancel
        run: npm run verify:workflow-concurrency
      - name: Verify every checkout keeps credentials isolated
        run: npm run verify:checkout-credentials
      - name: Verify every Bridge workflow job uses the reviewed runner image
        run: npm run verify:runner-image
      - name: Verify exact Node and npm toolchain policy
        run: npm run verify:toolchain
      - name: Verify every Bridge workflow job has a bounded timeout
        run: npm run verify:workflow-jobs
      - name: Verify uploaded artifacts have bounded retention
        run: npm run verify:artifact-retention
      - name: Verify repository-side workflow guards remain wired
        run: npm run verify:workflow-guards
      - name: Verify lockfile release mode is internally consistent
        run: npm run verify:lockfile-mode
      - name: Verify committed lockfile pair satisfies provenance policy when present
        run: npm run verify:committed-lockfiles
      - name: Verify Bridge supply-chain workflow policy
        run: npm run verify:supply-chain
      - name: Verify Bridge release artifacts and policy
        run: node scripts/release-preflight.mjs
      - name: Verify production signaling Origin policy
        run: npm run verify:production-origin
      - name: Verify placeholder-only production configuration template
        run: npm run verify:deployment-template
      - name: Test lockfile and release artifact policies
        run: npm run test:lockfile-policy
      - name: Require reviewed committed lockfiles before producing a release artifact
        run: npm run verify:committed-lockfiles -- --require-present
      - name: Install dependencies from committed lockfile without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fail on high-severity dependency advisories
        run: npm audit --audit-level=high
      - name: Generate build dependency SBOM
        run: npm sbom --sbom-format cyclonedx > bridge-dependencies.cdx.json
      - name: Typecheck release graph
        run: npm run typecheck
      - name: Unit and signaling integration tests
        run: npm test
      - name: Build production-scoped static frontend
        run: npm run build:production
      - name: Build production signaling runtime
        run: |
          npm run build:server
          cp server/package.json dist-server/package.json
          cp server/package-lock.json dist-server/package-lock.json
      - name: Verify packaged signaling runtime install and security state
        working-directory: dist-server
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          npm ls --omit=dev --depth=0
          npm audit --omit=dev --audit-level=high
          npm sbom --omit=dev --sbom-format cyclonedx > bridge-runtime.cdx.json
          rm -rf node_modules
      - name: Generate release artifact SHA-256 manifest
        run: |
          find dist dist-server -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum > bridge-artifacts.sha256
          sha256sum bridge-dependencies.cdx.json >> bridge-artifacts.sha256
      - name: Verify release artifact SHA-256 manifest
        run: sha256sum --check bridge-artifacts.sha256
      - name: Verify release artifact contains only reviewed deployable content
        run: npm run verify:artifact-contents
      - name: Upload frontend, signaling runtime, SBOMs, and integrity manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bridge-release
          path: |
            dist
            dist-server
            bridge-dependencies.cdx.json
            bridge-artifacts.sha256
          if-no-files-found: error
          retention-days: 14

# This workflow intentionally stops at isolated build artifacts until a hosting
# target and credentials are selected.
