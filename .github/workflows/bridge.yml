name: Bridge CI

# Temporarily manual-only. GitHub has been failing Bridge CI before assigning
# a runner (no steps executed), which generates noisy failure notifications.
# Re-enable pull_request/push triggers once runner execution is healthy.
on:
  workflow_dispatch:
    inputs:
      lockfiles_only:
        description: Generate and upload the policy-validated lockfile pair without running the dependency-backed suite
        required: true
        default: false
        type: boolean

concurrency:
  group: bridge-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lockfiles:
    if: ${{ inputs.lockfiles_only == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - name: Verify Bridge-only change scope
        run: node scripts/verify-isolation.mjs
      - name: Verify workflow token permissions stay read-only
        run: npm run verify:workflow-permissions
      - name: Verify workflow concurrency stays bounded and superseded runs cancel
        run: npm run verify:workflow-concurrency
      - name: Verify every checkout keeps credentials isolated
        run: npm run verify:checkout-credentials
      - name: Verify every Bridge workflow job uses the reviewed runner image
        run: npm run verify:runner-image
      - name: Verify exact Node and npm toolchain policy
        run: npm run verify:toolchain
      - name: Verify every Bridge workflow job has a bounded timeout
        run: npm run verify:workflow-jobs
      - name: Verify uploaded artifacts have bounded retention
        run: npm run verify:artifact-retention
      - name: Verify repository-side workflow guards remain wired
        run: npm run verify:workflow-guards
      - name: Verify lockfile release mode is internally consistent
        run: npm run verify:lockfile-mode
      - name: Verify committed lockfile pair satisfies provenance policy when present
        run: npm run verify:committed-lockfiles
      - name: Verify Bridge supply-chain workflow policy
        run: npm run verify:supply-chain
      - name: Verify Bridge release artifacts and policy
        run: node scripts/release-preflight.mjs
      - name: Test lockfile provenance policy
        run: npm run test:lockfile-policy
      - name: Generate registry-backed lockfiles for repository handoff
        run: npm run lockfiles:generate
      - name: Re-verify generated lockfile pair before publication
        run: npm run verify:committed-lockfiles
      - name: Bind generated lockfiles to this source revision
        run: npm run lockfiles:handoff-manifest
      - name: Verify lockfile handoff manifest
        run: npm run verify:lockfiles-handoff
      - name: Upload generated lockfile pair for repository handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bridge-generated-lockfile-pair
          path: |
            package-lock.json
            server/package-lock.json
            lockfile-handoff-manifest.json
          if-no-files-found: error
          retention-days: 7

  validate:
    if: ${{ inputs.lockfiles_only == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - name: Verify Bridge-only change scope
        run: node scripts/verify-isolation.mjs
      - name: Verify workflow token permissions stay read-only
        run: npm run verify:workflow-permissions
      - name: Verify workflow concurrency stays bounded and superseded runs cancel
        run: npm run verify:workflow-concurrency
      - name: Verify every checkout keeps credentials isolated
        run: npm run verify:checkout-credentials
      - name: Verify every Bridge workflow job uses the reviewed runner image
        run: npm run verify:runner-image
      - name: Verify exact Node and npm toolchain policy
        run: npm run verify:toolchain
      - name: Verify every Bridge workflow job has a bounded timeout
        run: npm run verify:workflow-jobs
      - name: Verify uploaded artifacts have bounded retention
        run: npm run verify:artifact-retention
      - name: Verify repository-side workflow guards remain wired
        run: npm run verify:workflow-guards
      - name: Verify lockfile release mode is internally consistent
        run: npm run verify:lockfile-mode
      - name: Verify committed lockfile pair satisfies provenance policy
        run: npm run verify:committed-lockfiles -- --require-present
      - name: Verify Bridge supply-chain workflow policy
        run: npm run verify:supply-chain
      - name: Verify Bridge release artifacts and policy
        run: node scripts/release-preflight.mjs
      - name: Verify production signaling Origin policy
        run: npm run verify:production-origin
      - name: Verify placeholder-only production configuration template
        run: npm run verify:deployment-template
      - name: Test lockfile provenance policy
        run: npm run test:lockfile-policy
      - name: Install dependencies from committed lockfile without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fail on high-severity dependency advisories
        run: npm audit --audit-level=high
      - name: Generate dependency SBOM for review
        run: npm sbom --sbom-format cyclonedx > bridge-dependencies.cdx.json
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and signaling integration tests
        run: npm test
      - name: Build static frontend
        run: npm run build
      - name: Build production signaling runtime
        run: npm run build:server
      - name: Install Playwright browsers for browser checks
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Browser accessibility and two-peer checks
        run: npm run test:e2e
      - name: Install local TURN test server
        run: |
          sudo apt-get update
          sudo apt-get install -y coturn
      - name: Start local TURN test server
        run: |
          turnserver \
            --no-cli \
            --no-tls \
            --no-dtls \
            --fingerprint \
            --lt-cred-mech \
            --realm=bridge.test \
            --user=bridge-test:bridge-test-password \
            --listening-ip=127.0.0.1 \
            --relay-ip=127.0.0.1 \
            --listening-port=3478 \
            --min-port=49160 \
            --max-port=49200 \
            --log-file=stdout \
            > /tmp/bridge-coturn.log 2>&1 &
          echo $! > /tmp/bridge-coturn.pid
          sleep 1
      - name: Relay-only TURN integration check
        env:
          BRIDGE_E2E_TURN: "1"
          VITE_BRIDGE_STUN_URLS: "stun:127.0.0.1:3478"
          VITE_BRIDGE_TURN_URLS: "turn:127.0.0.1:3478?transport=udp"
          VITE_BRIDGE_TURN_USERNAME: "bridge-test"
          VITE_BRIDGE_TURN_CREDENTIAL: "bridge-test-password"
        run: npm run test:e2e:turn
      - name: Re-verify committed lockfile pair after validation
        run: npm run verify:committed-lockfiles -- --require-present
      - name: Upload validated dependency SBOM for repository review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bridge-dependency-sbom
          path: bridge-dependencies.cdx.json
          if-no-files-found: error
          retention-days: 7
      - name: Show TURN log on failure
        if: failure()
        run: cat /tmp/bridge-coturn.log || true
