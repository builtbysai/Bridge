<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
<defs><pattern id="bsl2" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity="0.018"/></pattern></defs>
<rect x="1" y="1" width="998" height="468" rx="14" fill="#070b08" stroke="#1d3a26" stroke-width="2"/>
<rect x="1" y="1" width="998" height="468" rx="14" fill="url(#bsl2)"/>
<text x="36" y="42" fill="#e8f5ec" font-size="17" font-weight="bold">Session-first, not cloud-first</text>
<text x="36" y="68" fill="#33ff66" font-size="13.5" font-style="italic">"Connect two devices for a moment. Move whatever you need."</text>
<text x="36" y="100" fill="#8fa89a" font-size="12">Three session modes — deliberately not a cloud drive, chat app, or notes workspace.</text>

<g>
<rect x="36" y="150" width="293" height="220" rx="12" fill="#0a100c" stroke="#1d3a26" stroke-width="1.5"/>
<g transform="translate(58,166)"><rect x="0" y="6" width="52" height="40" rx="6" fill="none" stroke="#33ff66" stroke-width="2.5"/><path d="M26 -8 L26 30 M14 4 L26 -8 L38 4" stroke="#33ff66" stroke-width="2.5" fill="none"/></g>
<text x="128" y="196" fill="#e8f5ec" font-size="15" font-weight="bold">SEND</text>
<text x="58" y="252" fill="#8fa89a" font-size="11.5">Push files, text, links, or</text><text x="58" y="270" fill="#8fa89a" font-size="11.5">clipboard snippets to the</text><text x="58" y="288" fill="#8fa89a" font-size="11.5">connected device.</text>
</g>
<g>
<rect x="353" y="150" width="293" height="220" rx="12" fill="#0a100c" stroke="#1d3a26" stroke-width="1.5"/>
<g transform="translate(375,166)"><rect x="0" y="6" width="52" height="40" rx="6" fill="none" stroke="#33ff66" stroke-width="2.5"/><path d="M26 54 L26 16 M14 28 L26 16 L38 28" stroke="#33ff66" stroke-width="2.5" fill="none"/></g>
<text x="445" y="196" fill="#e8f5ec" font-size="15" font-weight="bold">REQUEST</text>
<text x="375" y="252" fill="#8fa89a" font-size="11.5">Ask the other device for a</text><text x="375" y="270" fill="#8fa89a" font-size="11.5">photo, file, text, or clipboard</text><text x="375" y="288" fill="#8fa89a" font-size="11.5">content.</text>
</g>
<g>
<rect x="671" y="150" width="293" height="220" rx="12" fill="#0a100c" stroke="#1d3a26" stroke-width="1.5"/>
<g transform="translate(693,166)"><path d="M6 52 L6 22 Q6 4 26 4 Q46 4 46 22 L46 52" fill="none" stroke="#33ff66" stroke-width="2.5"/><path d="M26 52 L26 30 M18 38 L26 30 L34 38" stroke="#33ff66" stroke-width="2.5" fill="none"/></g>
<text x="763" y="196" fill="#e8f5ec" font-size="15" font-weight="bold">RECEIVE</text>
<text x="693" y="252" fill="#8fa89a" font-size="11.5">Open a temporary guest portal</text><text x="693" y="270" fill="#8fa89a" font-size="11.5">so someone can send something</text><text x="693" y="288" fill="#8fa89a" font-size="11.5">to this device.</text>
</g>
<text x="36" y="440" fill="#4a5f52" font-size="11.5">receiver-driven workflows · transparent direct-vs-relayed routing · privacy-conscious pairing</text>
</svg>