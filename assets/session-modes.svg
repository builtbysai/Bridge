<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="2" y="2" width="996" height="556" rx="20" fill="#0b1018" stroke="#223044" stroke-width="1.5"/>

  <text x="40" y="54" fill="#f5f8ff" font-size="20" font-weight="700" letter-spacing="-0.4">Session-first, not cloud-first</text>
  <text x="40" y="82" fill="#b8c4d6" font-size="14" font-style="italic">&#8220;Connect two devices for a moment. Move whatever you need.&#8221;</text>
  <text x="40" y="108" fill="#8492a8" font-size="12.5">Three session modes &#8212; deliberately not a cloud drive, chat app, or notes workspace.</text>

  <!-- Send card -->
  <g>
    <rect x="40" y="140" width="292" height="244" rx="14" fill="#0f1621" stroke="#223044" stroke-width="1.5"/>
    <g transform="translate(186,206)" stroke="#70a9ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-20 12 h40"/>
      <path d="M-20 12 v-7 M20 12 v-7"/>
      <path d="M0 8 V-18 M-10 -8 L0 -18 L10 -8"/>
    </g>
    <text x="186" y="272" text-anchor="middle" fill="#f5f8ff" font-size="17" font-weight="700">Send</text>
    <text x="186" y="300" text-anchor="middle" fill="#b8c4d6" font-size="13">Push files, text, links, and clipboard</text>
    <text x="186" y="322" text-anchor="middle" fill="#b8c4d6" font-size="13">snippets to the connected device.</text>
    <text x="186" y="358" text-anchor="middle" fill="#64748b" font-size="11.5">you push &#183; they approve</text>
  </g>

  <!-- Request card -->
  <g>
    <rect x="354" y="140" width="292" height="244" rx="14" fill="#0f1621" stroke="#223044" stroke-width="1.5"/>
    <g transform="translate(500,206)" stroke="#70a9ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -18 V8 M-10 -2 L0 8 L10 -2"/>
      <path d="M-20 14 h40"/>
      <path d="M-20 14 v-7 M20 14 v-7"/>
    </g>
    <text x="500" y="272" text-anchor="middle" fill="#f5f8ff" font-size="17" font-weight="700">Request</text>
    <text x="500" y="300" text-anchor="middle" fill="#b8c4d6" font-size="13">Ask the other device for a photo, file,</text>
    <text x="500" y="322" text-anchor="middle" fill="#b8c4d6" font-size="13">text, or clipboard content.</text>
    <text x="500" y="358" text-anchor="middle" fill="#64748b" font-size="11.5">you ask &#183; they approve</text>
  </g>

  <!-- Receive card -->
  <g>
    <rect x="668" y="140" width="292" height="244" rx="14" fill="#0f1621" stroke="#223044" stroke-width="1.5"/>
    <g transform="translate(814,206)" stroke="#70a9ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-16 -16 h32 v32 h-32 z"/>
      <path d="M16 -16 L4 -4 v20"/>
    </g>
    <text x="814" y="272" text-anchor="middle" fill="#f5f8ff" font-size="17" font-weight="700">Receive</text>
    <text x="814" y="300" text-anchor="middle" fill="#b8c4d6" font-size="13">Open a temporary guest portal so</text>
    <text x="814" y="322" text-anchor="middle" fill="#b8c4d6" font-size="13">someone can send to this device.</text>
    <text x="814" y="358" text-anchor="middle" fill="#64748b" font-size="11.5">they send &#183; you approve</text>
  </g>

  <!-- honesty footer -->
  <text x="500" y="428" text-anchor="middle" fill="#8492a8" font-size="12.5">No accounts &#183; no permanent cloud storage &#183; sessions expire by design.</text>
  <g>
    <rect x="280" y="452" width="440" height="44" rx="22" fill="none" stroke="#334765" stroke-width="1.5"/>
    <text x="500" y="479" text-anchor="middle" fill="#b8c4d6" font-size="13">Production-oriented beta &#8212; not yet production-approved</text>
  </g>
</svg>
