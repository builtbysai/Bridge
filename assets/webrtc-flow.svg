<text x="36" y="40" fill="#e8f5ec" font-size="17" font-weight="bold">Bridge — how a transfer moves</text>
<text x="36" y="60" fill="#8fa89a" font-size="12">signaling is temporary · the transfer itself is end-to-end encrypted</text>

