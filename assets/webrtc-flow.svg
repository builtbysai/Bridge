<text x="500" y="178" text-anchor="middle" fill="#8fa89a" font-size="11">ephemeral WebSocket rendezvous</text>
</g>
<line x1="225" y1="130" x2="405" y2="130" stroke="#8fa89a" stroke-width="1.5" stroke-dasharray="7 5"/>
