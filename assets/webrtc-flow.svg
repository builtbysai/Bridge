<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="2" y="2" width="996" height="736" rx="20" fill="#0b1018" stroke="#223044" stroke-width="1.5"/>

  <!-- header -->
  <text x="40" y="54" fill="#f5f8ff" font-size="20" font-weight="700" letter-spacing="-0.4">How a transfer moves</text>
  <text x="40" y="80" fill="#8492a8" font-size="13">Signaling is temporary &#183; the transfer itself is end-to-end encrypted</text>

  <!-- device cards -->
  <g>
    <rect x="40" y="112" width="290" height="96" rx="14" fill="#0f1621" stroke="#223044" stroke-width="1.5"/>
    <circle cx="64" cy="136" r="3.5" fill="#334765"/><circle cx="78" cy="136" r="3.5" fill="#334765"/><circle cx="92" cy="136" r="3.5" fill="#334765"/>
    <text x="62" y="172" fill="#f5f8ff" font-size="15" font-weight="700">Device A</text>
    <text x="62" y="193" fill="#8492a8" font-size="12.5">host browser</text>
  </g>
  <g>
    <rect x="670" y="112" width="290" height="96" rx="14" fill="#0f1621" stroke="#223044" stroke-width="1.5"/>
    <circle cx="694" cy="136" r="3.5" fill="#334765"/><circle cx="708" cy="136" r="3.5" fill="#334765"/><circle cx="722" cy="136" r="3.5" fill="#334765"/>
    <text x="692" y="172" fill="#f5f8ff" font-size="15" font-weight="700">Device B</text>
    <text x="692" y="193" fill="#8492a8" font-size="12.5">guest browser</text>
  </g>

  <!-- step 1: pairing between the devices -->
  <g>
    <path d="M338 165 H462" fill="none" stroke="#334765" stroke-width="1.6" stroke-dasharray="5 5"/>
    <path d="M538 165 H662" fill="none" stroke="#334765" stroke-width="1.6" stroke-dasharray="5 5"/>
    <circle cx="500" cy="118" r="14" fill="#1e5fae"/>
    <text x="500" y="123" text-anchor="middle" fill="#f5f8ff" font-size="13" font-weight="700">1</text>
    <g transform="translate(472,138)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="#0f1621" stroke="#70a9ff" stroke-width="1.8"/>
      <rect x="9" y="9" width="14" height="14" rx="2" fill="none" stroke="#b8c4d6" stroke-width="2.4"/>
      <rect x="33" y="9" width="14" height="14" rx="2" fill="none" stroke="#b8c4d6" stroke-width="2.4"/>
      <rect x="9" y="33" width="14" height="14" rx="2" fill="none" stroke="#b8c4d6" stroke-width="2.4"/>
      <rect x="33" y="33" width="6" height="6" fill="#b8c4d6"/>
      <rect x="42" y="33" width="5" height="5" fill="#64748b"/>
      <rect x="33" y="42" width="5" height="5" fill="#64748b"/>
    </g>
    <text x="500" y="216" text-anchor="middle" fill="#b8c4d6" font-size="13" font-weight="600">Pair with a QR code or link</text>
    <text x="500" y="236" text-anchor="middle" fill="#8492a8" font-size="12">session ID in the query string &#183; 256-bit secret in the URL fragment</text>
    <text x="500" y="254" text-anchor="middle" fill="#64748b" font-size="12">URL fragments never reach the server</text>
  </g>

  <!-- step 2: negotiate -->
  <g>
    <rect x="40" y="280" width="920" height="118" rx="14" fill="#0f1621" stroke="#223044" stroke-width="1.5"/>
    <circle cx="78" cy="318" r="14" fill="#1e5fae"/>
    <text x="78" y="323" text-anchor="middle" fill="#f5f8ff" font-size="13" font-weight="700">2</text>
    <text x="104" y="313" fill="#f5f8ff" font-size="15" font-weight="700">Negotiate</text>
    <text x="104" y="340" fill="#b8c4d6" font-size="13">An ephemeral WebSocket rendezvous exchanges SDP + ICE candidates.</text>
    <text x="104" y="362" fill="#8492a8" font-size="13">Signaling sees only the SHA-256 verifier &#8212; payload bytes never pass through it.</text>
    <g transform="translate(796,296)">
      <rect x="0" y="0" width="150" height="30" rx="15" fill="none" stroke="#334765" stroke-width="1.5"/>
      <circle cx="18" cy="15" r="7" fill="none" stroke="#8492a8" stroke-width="1.8"/>
      <path d="M18 11 L18 15 L21 17" stroke="#8492a8" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <text x="32" y="19.5" fill="#8492a8" font-size="12">in-memory &#183; TTL</text>
    </g>
  </g>

  <!-- steps 3+4: the encrypted channel -->
  <g>
    <rect x="40" y="418" width="920" height="236" rx="14" fill="#141d2a" stroke="#334765" stroke-width="1.5"/>
    <rect x="40" y="418" width="4" height="236" rx="2" fill="#70a9ff"/>
    <g transform="translate(66,446)" stroke="#70a9ff" stroke-width="2.4" fill="none" stroke-linecap="round">
      <rect x="-9" y="0" width="18" height="14" rx="3.5"/>
      <path d="M-5.5 0 v-3.5 a5.5 5.5 0 0 1 11 0 V0"/>
    </g>
    <text x="92" y="458" fill="#f5f8ff" font-size="15" font-weight="700">End-to-end encrypted WebRTC DataChannel</text>
    <g transform="translate(706,438)">
      <rect x="0" y="0" width="74" height="28" rx="14" fill="#0b1018" stroke="#334765" stroke-width="1.5"/>
      <circle cx="16" cy="14" r="4.5" fill="#6ee7b7"/>
      <text x="27" y="18.5" fill="#b8c4d6" font-size="12" font-weight="600">Direct</text>
      <rect x="84" y="0" width="88" height="28" rx="14" fill="#0b1018" stroke="#334765" stroke-width="1.5"/>
      <circle cx="100" cy="14" r="4.5" fill="#f5c563"/>
      <text x="111" y="18.5" fill="#b8c4d6" font-size="12" font-weight="600">Relayed</text>
    </g>
    <line x1="64" y1="486" x2="936" y2="486" stroke="#223044" stroke-width="1.5"/>

    <circle cx="78" cy="526" r="14" fill="#1e5fae"/>
    <text x="78" y="531" text-anchor="middle" fill="#f5f8ff" font-size="13" font-weight="700">3</text>
    <text x="104" y="521" fill="#f5f8ff" font-size="14" font-weight="700">Confirm keys</text>
    <text x="104" y="545" fill="#b8c4d6" font-size="13">Both browsers exchange session- and role-bound HMAC proofs (bridge-key-confirm).</text>
    <text x="104" y="565" fill="#b8c4d6" font-size="13">Transfer code doesn&#8217;t touch the channel until the expected peer proof verifies.</text>

    <circle cx="78" cy="602" r="14" fill="#1e5fae"/>
    <text x="78" y="607" text-anchor="middle" fill="#f5f8ff" font-size="13" font-weight="700">4</text>
    <text x="104" y="597" fill="#f5f8ff" font-size="14" font-weight="700">Transfer</text>
    <text x="104" y="621" fill="#b8c4d6" font-size="13">HKDF-SHA-256 derives the transfer key &#183; AES-256-GCM per-chunk encryption &#183; full-payload SHA-256 verification.</text>
    <text x="104" y="641" fill="#64748b" font-size="12">Interrupted? Replacement channels repeat key confirmation before any resume &#183; relay-only mode fails closed without TURN</text>
  </g>

  <!-- honesty footer -->
  <g>
    <rect x="280" y="670" width="440" height="40" rx="20" fill="none" stroke="#334765" stroke-width="1.5"/>
    <text x="500" y="695" text-anchor="middle" fill="#b8c4d6" font-size="13">Production-oriented beta &#8212; not yet production-approved</text>
  </g>
</svg>
