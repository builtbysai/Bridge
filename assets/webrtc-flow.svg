<text x="500" y="336" text-anchor="middle" fill="#33ff66" font-size="12.5" font-weight="bold">WebRTC DataChannel — direct, end-to-end encrypted</text>
<text x="500" y="356" text-anchor="middle" fill="#8fa89a" font-size="11">HKDF-derived AES-256-GCM keys · full-payload SHA-256 verification</text>
<text x="36" y="392" fill="#8fa89a" font-size="11">STUN for NAT traversal · TURN fallback</text>
<text x="36" y="410" fill="#8fa89a" font-size="11">optional relay-only privacy mode</text>

